[versions]
    agp = "9.4.1"
    kotlin = "2.2.10"
    serializable = "1.11.0"
    lifecycle = "2.11.0"
    activityCompose = "1.13.0"
    composeBom = "2026.09.00"
    coreKtx = "1.19.1"
    navigation = "2.10.2"
    navigationViewModel = "1.4.0"
    runtimeLivedata = "1.12.1"
    hilt = "2.60.1"
    room = "2.8.5"
    splashscreen = "1.2.0"
    coil = "2.7.0"
    accompanistPermissions = "0.37.3"
    accompanistPager = "0.36.0"
    junit = "4.13.2"
    junitVersion = "1.3.0"
    mockk = "1.14.11"
    espressoCore = "3.7.0"

[libraries]
    accompanist-permissions = { module = "com.google.accompanist:accompanist-permissions", version.ref = "accompanistPermissions" }
    accompanist-pager-indicator = { module = "com.google.accompanist:accompanist-pager-indicators", version.ref = "accompanistPager" }
    androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
    androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
    androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
    androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
    androidx-runtime-livedata = { group = "androidx.compose.runtime", name = "runtime-livedata", version.ref = "runtimeLivedata" }
    androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
    androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
    androidx-ui = { group = "androidx.compose.ui", name = "ui" }
    androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
    androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
    androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
    androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
    androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
    androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
    androidx-material-icons = { group = "androidx.compose.material", name = "material-icons-extended" }
    androidx-material3-windowsize = { group = "androidx.compose.material3", name = "material3-window-size-class" }
    hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
    hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
    room = { module = "androidx.room:room-runtime", version.ref = "room" }
    room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
    room-coroutines = { module = "androidx.room:room-ktx", version.ref = "room" }
    splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
    navigation = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
    kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serializable" }
    navigation-viewmodel = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "navigationViewModel" }
    coil = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
    junit = { group = "junit", name = "junit", version.ref = "junit" }
    mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
    androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
    androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
    agp = { id = "com.android.application", version.ref = "agp" }
    jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
    hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
    compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
    serializable = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
